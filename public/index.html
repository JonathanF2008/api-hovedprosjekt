<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Notater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Notater & Todo-liste</h1>

    <!-- Container for to kolonner -->
    <div class="container">
        <!-- Venstre kolonne: Notater -->
        <div class="column" id="notesColumn">
            <h2>Notater</h2>
            <input id="noteTitle" placeholder="Tittel" />
            <textarea id="noteContent" placeholder="Skriv notatet her..."></textarea>
            <button onclick="addNote()">Lagre notat</button>
            <ul id="notesList"></ul>
        </div>

        <!-- Høyre kolonne: Todo-liste -->
        <div class="column" id="todoColumn">
            <h2>Todo-liste</h2>
            <input id="todoInput" placeholder="Ny oppgave" />
            <button onclick="addTodo()">Legg til oppgave</button>
            <ul id="todoList"></ul>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js?v=2"></script>
    <script src="todo.js"></script>

</body>
</html>
