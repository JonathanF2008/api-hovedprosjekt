<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Notater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Notater</h1>

    
    <input id="noteTitle" placeholder="Tittel" />

    
    <textarea id="noteContent" placeholder="Skriv notatet her..."></textarea>

   
    <button onclick="addNote()">Lagre notat</button>

    
    <ul id="notesList"></ul>

    <hr>

   
    <h2>Todo-liste</h2>
    <input id="todoInput" placeholder="Ny oppgave" />
    <button onclick="addTodo()">Legg til oppgave</button>
    <ul id="todoList"></ul>

   
    <script src="script.js"></script>

   
    <script src="todo.js"></script>

</body>
</html>
