<!DOCTYPE html>
<html>
<head>
    <title>Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Notes</h1>

<!-- Input for tittel -->
<input id="noteTitle" placeholder="Tittel" />

<!-- Tekstområde for hovedinnhold -->
<textarea id="noteContent" placeholder="Skriv notatet her..."></textarea>

<!-- Knapp for å lagre notat -->
<button onclick="addNote()">Save</button>

<!-- Liste der notatene vises -->
<ul id="notesList"></ul>

<script src="script.js"></script>
</body>
</html>
